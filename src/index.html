<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="description" content="Spin the wheel, race the clock, beat your friends. A trivia game with daily challenges, streaks, and shareable results." />
    <meta property="og:title" content="Spinlore — beat your friends" />
    <meta property="og:description" content="Spin the wheel. Race the clock. Daily challenges, streaks, and bragging rights." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo-no-background.png" />
    <link rel="apple-touch-icon" href="/logo-no-background.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <title>Spinlore — beat your friends</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Only register the service worker on real deployments. In localhost dev,
      // it intercepts /admin and other history-fallback routes and breaks HMR.
      // On localhost, actively unregister any leftover SW from a previous session.
      if ("serviceWorker" in navigator) {
        var isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";
        if (isLocal) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        } else {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("/service-worker.js").catch(function () {});
          });
        }
      }
    </script>
  </body>
</html>
